events {
    worker_connections 1024;
}

http {
    upstream insights {
        server insights:8001;
    }

    upstream frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/m;

    server {
        listen 80;
        server_name hygini.app www.hygini.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name hygini.app www.hygini.app;

        ssl_certificate     /etc/letsencrypt/live/hygini.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hygini.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location ~ ^/agents/(register|login|refresh) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /agents/context/upload {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 15m;
        }

        location /agents/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/meetings/[^/]+/upload-complete {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_max_body_size 60m;
        }

        location /meetings/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            client_max_body_size 60m;
        }

        location /growth {
            proxy_pass http://insights;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://insights;
            access_log off;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}