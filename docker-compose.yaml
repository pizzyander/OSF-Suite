services:
  whisper:
    build:
      context: .
      dockerfile: Dockerfile
    image: 717952410994.dkr.ecr.us-east-1.amazonaws.com/osf-suite/whisper-service:latest
    container_name: whisper-service
    restart: unless-stopped
    runtime: runc
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      MAX_FILE_MB: "50"
      MODEL_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - osf-net

  nginx:
    image: nginx:1.27-alpine
    container_name: osf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - insights
    networks:
      - osf-net
    restart: unless-stopped

  # NOTE: the self-hosted `ollama` service that used to live here has been
  # removed. Both `insights` and `worker` now talk to Ollama Cloud
  # (https://ollama.com) instead — nothing in this stack calls a local
  # Ollama container anymore. Removing it frees real RAM/disk on the EC2
  # instance. To revert to self-hosted later: re-add an `ollama` service
  # (image: ollama/ollama, volume for model weights, port 11434), point
  # OLLAMA_URL back at http://ollama:11434 for insights/worker below, and
  # re-add `depends_on: ollama: condition: service_started` to both.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: 717952410994.dkr.ecr.us-east-1.amazonaws.com/osf-suite/frontend:latest
    container_name: osf-frontend
    expose:
      - "80"
    networks:
      - osf-net
    restart: unless-stopped
    depends_on:
      - insights

  insights:
    build:
      context: ./insights
      dockerfile: Dockerfile
    image: 717952410994.dkr.ecr.us-east-1.amazonaws.com/osf-suite/insights:latest
    container_name: insights-service
    env_file:
      - .env
    environment:
      WHISPER_URL: http://whisper:8000
      # Unused directly by any route in main.py today, but kept consistent
      # with worker's Cloud config rather than left pointing at a
      # self-hosted URL that no longer exists in this stack.
      OLLAMA_URL: https://ollama.com
      OLLAMA_MODEL: gpt-oss:20b-cloud
      REDIS_URL: redis://redis:6379
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: osf-suite-audio
      DIARIZATION_URL: http://diarization:8002
      # DEEPGRAM_API_KEY and OLLAMA_API_KEY are picked up from .env via
      # env_file above — not duplicated here to avoid two sources of truth.
    depends_on:
      whisper:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - osf-net
    restart: unless-stopped

  worker:
    build:
      context: ./insights
      dockerfile: Dockerfile
    image: 717952410994.dkr.ecr.us-east-1.amazonaws.com/osf-suite/worker:latest
    container_name: osf-worker
    command: python -u worker.py
    env_file:
      - .env
    environment:
      WHISPER_URL: http://whisper:8000
      OLLAMA_URL: https://ollama.com
      OLLAMA_MODEL: gpt-oss:20b-cloud
      PASS1_MODEL: gpt-oss:20b-cloud
      REDIS_URL: redis://redis:6379
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: osf-suite-audio
      # OLLAMA_API_KEY comes from .env via env_file above.
    depends_on:
      whisper:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - osf-net
    # Un-commented: the reconciler that sweeps for orphaned live-transcription
    # sessions runs INSIDE this process (reconciler_loop, started in run()).
    # If the worker crashes and doesn't restart, that safety net silently
    # goes down with it — auto-restart is load-bearing here, not cosmetic.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    networks:
      - osf-net
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    networks:
      - osf-net
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot

  redis:
    image: redis:7-alpine
    container_name: osf-redis
    networks:
      - osf-net
    restart: unless-stopped

networks:
  osf-net:
    driver: bridge

volumes:
  whisper-models:
  certbot-etc:
  certbot-var:
  certbot-www:
  prometheus_data:
  grafana_data: