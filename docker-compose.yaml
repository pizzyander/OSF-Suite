version: "3.9"

services:
  whisper:
    build:
      context: .
      dockerfile: Dockerfile
    image: whisper-service:latest
    container_name: whisper-service
    restart: unless-stopped
    runtime: runc
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      MAX_FILE_MB: "50"
      MODEL_DIR: /models
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - osf-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - osf-net
    restart: unless-stopped

  insights:
    build:
      context: ./insights
      dockerfile: Dockerfile
    container_name: insights-service
    ports:
      - "8001:8001"
    environment:
      WHISPER_URL: http://whisper:8000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
    depends_on:
      whisper:
        condition: service_healthy    # waits for /ready to pass
      ollama:
        condition: service_started
    networks:
      - osf-net
    restart: unless-stopped

networks:
  osf-net:
    driver: bridge

volumes:
  whisper-models:
  ollama-models: