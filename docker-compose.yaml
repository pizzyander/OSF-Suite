services:
  whisper:
    build:
      context: .
      dockerfile: Dockerfile
    image: whisper-service:latest
    container_name: whisper-service
    restart: unless-stopped
    runtime: runc
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      MAX_FILE_MB: "50"
      MODEL_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - osf-net
  nginx:
    image: nginx:1.27-alpine
    container_name: osf-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - insights
    networks:
      - osf-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.1.44
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - osf-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osf-frontend
    expose:
      - "80"
    networks:
      - osf-net
    restart: unless-stopped
    depends_on:
      - insights
  insights:
    build:
      context: ./insights
      dockerfile: Dockerfile
    container_name: insights-service
    #ports:
    #  - "8001:8001"
    env_file:
      - .env
    environment:
      WHISPER_URL: http://whisper:8000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: phi3:mini
      REDIS_URL: redis://redis:6379
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: osf-suite-audio
      DIARIZATION_URL: http://diarization:8002
    depends_on:
      whisper:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - osf-net
    restart: unless-stopped

  worker:
    build:
      context: ./insights
      dockerfile: Dockerfile
    container_name: osf-worker
    command: python -u worker.py
    env_file:
      - .env
    environment:
      WHISPER_URL: http://whisper:8000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: phi3:mini
      REDIS_URL: redis://redis:6379
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: osf-suite-audio
    depends_on:
      whisper:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - osf-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: osf-redis
    networks:
      - osf-net
    restart: unless-stopped

networks:
  osf-net:
    driver: bridge

volumes:
  whisper-models:
  ollama-models: