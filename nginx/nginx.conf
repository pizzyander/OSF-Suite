events {
    worker_connections 1024;
}

http {
    upstream insights {
        server insights:8001;
    }

    upstream frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/m;

    server {
        listen 80;
        server_name _;

        # -- Auth (strict rate limit) ------------------------------------------
        location ~ ^/agents/(register|login|refresh) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Context file upload -----------------------------------------------
        location /agents/context/upload {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 15m;
        }

        # -- All agent routes --------------------------------------------------
        location /agents/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Organizations (create org, invites, member management) ------------
        # Prefix match — /organizations, /organizations/invites,
        # /organizations/members, /organizations/invites/{id} all land here.
        location /organizations {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Invite preview + acceptance (the /join?token=... landing page) ----
        # GET /invites/{token} is intentionally public (no auth) so someone
        # can preview an invite before logging in — still rate-limited here
        # against token-guessing/enumeration attempts.
        location /invites/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Manager/admin team dashboard (team meetings + aggregate stats) ----
        location /team {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Live transcription (WebSocket) -------------------------------------
        # Regex locations are checked before plain prefix locations like
        # `location /meetings/` below, so this intercepts the live route
        # first and gives it the upgrade headers a WebSocket handshake
        # actually needs. Without proxy_http_version 1.1 + Upgrade +
        # Connection, Nginx forwards this as a plain HTTP GET — which
        # FastAPI correctly 404s, since only a WebSocket handler exists
        # at this path, not a regular HTTP one. The query string (?token=...)
        # doesn't affect this match; Nginx matches on path only.
        location ~ ^/meetings/[^/]+/live$ {
            proxy_pass http://insights;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # This connection stays open for the whole live recording —
            # a normal proxy_read_timeout (often 60s default) would kill
            # a call the moment nobody speaks for a minute.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -- Upload complete (long timeout) ------------------------------------
        location ~ ^/meetings/[^/]+/upload-complete {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_max_body_size 60m;
        }

        # -- All meeting routes ------------------------------------------------
        location /meetings/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            client_max_body_size 60m;
        }

        location /meetings {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Growth + health ---------------------------------------------------
        location /growth {
            proxy_pass http://insights;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://insights;
            access_log off;
        }

        # -- Everything else → React SPA --------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}