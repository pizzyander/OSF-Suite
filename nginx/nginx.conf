events {
    worker_connections 1024;
}

http {
    upstream insights {
        server insights:8001;
    }

    upstream frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/m;

    server {
        listen 80;
        server_name hygini.app www.hygini.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name hygini.app www.hygini.app;

        ssl_certificate     /etc/letsencrypt/live/hygini.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hygini.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # -- Auth (strict rate limit) ------------------------------------------
        location ~ ^/agents/(register|login|refresh) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Context file upload -----------------------------------------------
        location /agents/context/upload {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 15m;
        }

        # -- All agent routes --------------------------------------------------
        location /agents/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Organizations (create org, invites, member management) ------------
        # Prefix match — /organizations, /organizations/invites,
        # /organizations/members, /organizations/invites/{id} all land here.
        location /organizations {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Invite preview + acceptance (the /join?token=... landing page) ----
        # GET /invites/{token} is intentionally public (no auth) so someone
        # can preview an invite before logging in — still rate-limited here
        # against token-guessing/enumeration attempts.
        location /invites/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Manager/admin team dashboard (team meetings + aggregate stats) ----
        location /team {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Live transcription (WebSocket) -------------------------------------
        # Regex locations are matched before plain prefix locations like
        # `location /meetings/` below, so this intercepts the live route
        # first and supplies the upgrade headers a WebSocket handshake
        # needs. Without proxy_http_version 1.1 + Upgrade + Connection,
        # Nginx forwards this as a plain HTTP request, which FastAPI
        # correctly 404s (only a WebSocket handler exists at this path).
        # The browser connects here as wss:// automatically since it's
        # served over HTTPS — no extra TLS config needed in this block,
        # the outer `listen 443 ssl` already covers it.
        location ~ ^/meetings/[^/]+/live$ {
            proxy_pass http://insights;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # This connection stays open for the whole live recording —
            # the default read timeout would kill it during any pause
            # in conversation longer than about a minute.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -- Upload complete (long timeout) ------------------------------------
        location ~ ^/meetings/[^/]+/upload-complete {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_max_body_size 60m;
        }

        # -- Meetings exact match (prevents FastAPI 307 redirect loop) ---------
        location = /meetings {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights/meetings?$query_string;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- All meeting routes ------------------------------------------------
        location /meetings/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            client_max_body_size 60m;
        }

        # -- Growth + health ---------------------------------------------------
        location /growth {
            proxy_pass http://insights;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://insights;
            access_log off;
        }

        # -- Everything else → React SPA --------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}