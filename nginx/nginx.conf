events {
    worker_connections 1024;
}

http {
    upstream insights {
        server insights:8001 max_fails=3 fail_timeout=10s;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream grafana {
        server grafana:3000;
    }

    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/m;

    server {
        listen 80;
        server_name hygini.app www.hygini.app grafana.hygini.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name hygini.app www.hygini.app;

        ssl_certificate     /etc/letsencrypt/live/hygini.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hygini.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # -- Auth (strict rate limit) ------------------------------------------
        location ~ ^/agents/(register|login|refresh) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Context file upload -----------------------------------------------
        location /agents/context/upload {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 15m;
        }

        # -- All agent routes --------------------------------------------------
        location /agents/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Organizations (create org, invites, member management) ------------
        location /organizations {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Invite preview + acceptance (the /join?token=... landing page) ----
        location /invites/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Manager/admin team dashboard (team meetings + aggregate stats) ----
        location /team {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Billing (checkout, Paystack webhook, subscription status) ---------
        location /billing {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Coaching plans + winning patterns -----------------------------------
        location /coaching {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Feedback + feature requests ------------------------------------------
        location /feedback {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /features {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /legal {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- Live transcription (WebSocket) -------------------------------------
        location ~ ^/meetings/[^/]+/live$ {
            proxy_pass http://insights;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -- Upload complete (long timeout) ------------------------------------
        location ~ ^/meetings/[^/]+/upload-complete {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_max_body_size 60m;
        }

        # -- Meetings exact match (prevents FastAPI 307 redirect loop) ---------
        location = /meetings {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights/meetings?$query_string;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -- All meeting routes ------------------------------------------------
        location /meetings/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            client_max_body_size 60m;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /referrals/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -- Growth + health ---------------------------------------------------
        location /growth {
            proxy_pass http://insights;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://insights;
            access_log off;
        }

        # -- Everything else → React SPA --------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    
        server {
        listen 443 ssl;
        server_name grafana.hygini.app;

        ssl_certificate     /etc/letsencrypt/live/grafana.hygini.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grafana.hygini.app/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://grafana;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}