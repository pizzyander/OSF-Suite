events {
    worker_connections 1024;
}

http {
    upstream insights {
        server insights:8001;
    }

    upstream whisper {
        server whisper:8000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/m;

    server {
        listen 80;
        server_name _;

        # -- Auth endpoints (strict rate limit) --------------------------------
        location ~ ^/agents/(register|login|refresh) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://insights;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # -- Upload complete (long timeout — Whisper chunked transcription) ----
        location ~ ^/meetings/[^/]+/upload-complete {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://insights;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            client_max_body_size 60m;
        }

        # -- Context upload (file upload — allow up to 15m body) ---------------
        location /agents/context/upload {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://insights;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 15m;
        }

        # -- All other API traffic ---------------------------------------------
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://insights;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 10m;
        }

        # -- Health (no rate limit, no auth) -----------------------------------
        location /health {
            proxy_pass http://insights;
            access_log off;
        }
    }
}