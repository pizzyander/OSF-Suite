name: Deploy OSF-Suite to EC2 via ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push insights image
        run: |
          docker build -t $ECR_REGISTRY/osf-suite/insights:latest -f insights/Dockerfile insights
          docker push $ECR_REGISTRY/osf-suite/insights:latest

      - name: Build and push worker image
        run: |
          docker build -t $ECR_REGISTRY/osf-suite/worker:latest -f worker/Dockerfile worker
          docker push $ECR_REGISTRY/osf-suite/worker:latest

      - name: Build and push frontend image
        run: |
          docker build -t $ECR_REGISTRY/osf-suite/frontend:latest -f frontend/Dockerfile frontend
          docker push $ECR_REGISTRY/osf-suite/frontend:latest

      - name: Build and push whisper-service image
        run: |
          docker build -t $ECR_REGISTRY/osf-suite/whisper-service:latest -f whisper-service/Dockerfile whisper-service
          docker push $ECR_REGISTRY/osf-suite/whisper-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest images and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/OSF-Suite

            echo "Authenticating to ECR via instance role..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            echo "Pulling latest code (for compose file / nginx config changes)..."
            git pull origin main

            echo "Pulling latest images from ECR..."
            docker compose pull

            echo "Restarting stack..."
            docker compose up -d

            echo "Pruning old unused images..."
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker compose ps
            curl -Ik https://hygini.app/health || exit 1
